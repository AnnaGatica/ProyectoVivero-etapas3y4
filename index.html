
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi vivero</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form">
        <h1>Agrega una planta</h1>

        <input type="text" name="nombre" id="nombre"
            placeholder="Nombre de la planta">

        <input type="number" name="precio" id="precio"
            placeholder="Ingresa el precio">

        <input type="text" name="dimension" id="dimension"
            placeholder="Ingresa su dimension">

        <input type="number" name="stock" id="stock"
            placeholder="Ingresa tu stock">

        <button id="agregar">Agregar</button>
    </div>

    <h1>Plantas registradas</h1>

    <div class="lista">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Dimension</th>
                    <th>Stock</th>
                </tr>
            </thead>

            <tbody class="tabla-registro">
            </tbody>
        </table>
    </div>

    <script src="db.js" type="module"></script>
</body>

</html>
